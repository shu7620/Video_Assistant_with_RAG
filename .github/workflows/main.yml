name: Deploy Backend to AWS ECR and EC2

on:
  push:
    branches:
      - main  # Change this to your new branch name if testing before merging

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, Tag, and Push Docker Image to ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: transcribex-backend
          IMAGE_TAG: latest
        run: |
          # Build from the backend directory
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG ./backend
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # Install Docker on EC2 if it isn't installed yet
            if ! [ -x "$(command -v docker)" ]; then
              sudo apt-get update
              sudo apt-get install -y docker.io
              sudo usermod -aG docker ubuntu
            fi
            
            # Install AWS CLI on EC2 if it isn't installed yet
            if ! [ -x "$(command -v aws)" ]; then
              sudo apt-get install -y awscli
            fi

            # Configure AWS CLI on EC2 using the environment variables passed temporarily
            export AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }}
            export AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }}
            export AWS_DEFAULT_REGION=${{ secrets.AWS_REGION }}

            # Log in to ECR from inside EC2
            aws ecr get-login-password --region $AWS_DEFAULT_REGION | docker login --username AWS --password-stdin ${{ steps.login-ecr.outputs.registry }}

            # Stop and remove the existing container if it exists
            docker stop transcribex-backend-container || true
            docker rm transcribex-backend-container || true

            # Pull the fresh image from ECR
            docker pull ${{ steps.login-ecr.outputs.registry }}/transcribex-backend:latest

            # Run the new Docker container (Change 8000:8000 to match your backend port)
            docker run -d --name transcribex-backend-container -p 8000:8000 ${{ steps.login-ecr.outputs.registry }}/transcribex-backend:latest