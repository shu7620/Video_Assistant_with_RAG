name: Deploy Backend via Self-Hosted Runner

on:
  push:
    branches:
      - main  # Triggers the pipeline when code is pushed to the main branch

jobs:
  build-and-deploy:
    # Executes this deployment pipeline directly on your EC2 instance hardware
    runs-on: self-hosted

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to Amazon ECR
        id: login-ecr
        run: |
          # Uses the EC2 IAM Instance Profile Role to securely log into ECR natively
          aws ecr get-login-password --region ap-southeast-2 | docker login --username AWS --password-stdin 992646609349.dkr.ecr.ap-southeast-2.amazonaws.com

      - name: Build and Push Docker Image to ECR
        env:
          ECR_REGISTRY: 992646609349.dkr.ecr.ap-southeast-2.amazonaws.com
          ECR_REPOSITORY: transcribex-backend
          IMAGE_TAG: latest
        run: |
          # Build the Docker image using the Dockerfile inside your backend folder
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG ./backend
          
          # Push the fresh container image to your AWS ECR Registry
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

      - name: Deploy Container Locally
        env:
          ECR_REGISTRY: 992646609349.dkr.ecr.ap-southeast-2.amazonaws.com
          ECR_REPOSITORY: transcribex-backend
        run: |
          # Stop and remove the old running instance to free up the port
          docker stop transcribex-backend-container || true
          docker rm transcribex-backend-container || true
          
          # Force clean dangling images to preserve limited Free Tier disk storage
          docker image prune -f || true
          
          # Pull down the latest build version from your ECR repository
          docker pull $ECR_REGISTRY/$ECR_REPOSITORY:latest
          
          # Spin up the updated container application on port 8000
          docker run -d --name transcribex-backend-container -p 8000:8000 $ECR_REGISTRY/$ECR_REPOSITORY:latest