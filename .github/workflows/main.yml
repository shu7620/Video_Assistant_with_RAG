name: Scaled Deploy via ECR Cloud Build

on:
  push:
    branches:
      - main

jobs:
  # Job 1: Build the image on GitHub's cloud servers
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-2

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and Push Docker Image
        env:
          ECR_REGISTRY: 992646609349.dkr.ecr.ap-southeast-2.amazonaws.com
          ECR_REPOSITORY: transcribex-backend
          IMAGE_TAG: latest
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG ./backend
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

  # Job 2: Pull and run the container securely on your EC2 instance
  deploy-to-ec2:
    needs: build-and-push
    runs-on: self-hosted
    steps:
      - name: Log in to Amazon ECR Natively
        run: |
          aws ecr get-login-password --region ap-southeast-2 | docker login --username AWS --password-stdin 992646609349.dkr.ecr.ap-southeast-2.amazonaws.com

      - name: Deploy Container Locally
        env:
          ECR_REGISTRY: 992646609349.dkr.ecr.ap-southeast-2.amazonaws.com
          ECR_REPOSITORY: transcribex-backend
        run: |
          sudo docker stop transcribex-backend-container || true
          sudo docker rm transcribex-backend-container || true
          
          # Clean old image layers instantly to safeguard Free Tier disk space
          sudo docker system prune -a -f || true
          
          sudo docker pull $ECR_REGISTRY/$ECR_REPOSITORY:latest
          
          # Spin up the container, injecting all required RAG and AI API configuration parameters
          sudo docker run -d \
            --name transcribex-backend-container \
            -p 5000:5000 \
            -e MONGO_URI="${{ secrets.MONGO_URI }}" \
            -e HUGGINGFACE_API_TOKEN="${{ secrets.HUGGINGFACE_API_TOKEN }}" \
            -e SARVAM_API_KEY="${{ secrets.SARVAM_API_KEY }}" \
            -e SARVAM_STT_MODEL="${{ secrets.SARVAM_STT_MODEL }}" \
            -e MISTRAL_API_KEY="${{ secrets.MISTRAL_API_KEY }}" \
            -e GROQ_API_KEY="${{ secrets.GROQ_API_KEY }}" \
            -e OPENROUTER_API_KEY="${{ secrets.OPENROUTER_API_KEY }}" \
            -e JWT_SECRET_KEY="${{ secrets.JWT_SECRET_KEY }}" \
            -e ALLOWED_ORIGINS="${{ secrets.ALLOWED_ORIGINS }}" \
            -e FFMPEG_BINARY_PATH="${{ secrets.FFMPEG_BINARY_PATH }}" \
            $ECR_REGISTRY/$ECR_REPOSITORY:latest